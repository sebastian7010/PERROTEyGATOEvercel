<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>El Súper Agropecuario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;600;700;800&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1a1a1a;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .header {
      text-align: center;
    }

    .brand {
      font-size: clamp(1.5rem, 5vw, 2rem);
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .brand-super {
      background: linear-gradient(90deg, #ff9500, #ff4757, #ff2d55);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-agropecuario {
      color: #f5c518;
    }

    .question-mark {
      color: #ffffff;
    }

    .question {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #a0a0a0;
      font-weight: 400;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    @media (min-width: 640px) {
      .buttons {
        flex-direction: row;
      }
    }

    .choice-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px 24px;
      border-radius: 1rem;
      text-decoration: none;
      color: #ffffff;
      font-family: 'Fira Sans', 'Inter', sans-serif;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
      min-height: 200px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* Shine effect */
    .choice-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      transform: skewX(-45deg);
      transition: all 0.5s ease;
      z-index: 1;
    }

    .choice-btn:hover::before,
    .choice-btn:active::before,
    .choice-btn.touched::before {
      left: 200%;
    }

    .choice-btn:hover,
    .choice-btn:active,
    .choice-btn.touched {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
    }

    /* Mascotas Button */
    .btn-mascotas {
      background: linear-gradient(45deg, #ff6600, #ff4757, #ff2d55);
    }

    .btn-mascotas:hover,
    .btn-mascotas:active,
    .btn-mascotas.touched {
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }

    /* Herramientas Button */
    .btn-herramientas {
      background: linear-gradient(45deg, #ff6600, #ffcc00);
    }

    .btn-herramientas:hover,
    .btn-herramientas:active,
    .btn-herramientas.touched {
      box-shadow: 0 6px 20px rgba(255, 204, 0, 0.4);
    }

    .logo-container {
      width: 100px;
      height: 100px;
      position: relative;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .logo-default {
      opacity: 1;
    }

    .logo-hover {
      opacity: 0;
    }

    .choice-btn:hover .logo-default,
    .choice-btn:active .logo-default,
    .choice-btn.touched .logo-default {
      opacity: 0;
      transform: scale(0.9);
    }

    .choice-btn:hover .logo-hover,
    .choice-btn:active .logo-hover,
    .choice-btn.touched .logo-hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .btn-subtitle {
      font-size: 0.875rem;
      font-weight: 400;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .choice-btn:hover .btn-subtitle,
    .choice-btn:active .btn-subtitle,
    .choice-btn.touched .btn-subtitle {
      opacity: 0.9;
      transform: translateY(0);
    }

    .footer {
      font-size: 0.75rem;
      color: #666666;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="brand">
        El <span class="brand-super">Súper</span> <span class="brand-agropecuario">Agropecuario</span>
      </h1>
      <p class="question"><span class="question-mark">¿</span>Qué estás buscando hoy<span class="question-mark">?</span></p>
    </header>

    <div class="buttons">
      <a href="https://www.perroteygatote.com/" class="choice-btn btn-mascotas" id="btnMascotas">
        <div class="logo-container">
          <img 
            src="./images/logo-rojo.jpg" 
            alt="Logo Mascotas" 
            class="logo-img logo-default"
          >
          <img 
            src="./images/logo-blanco.jpg" 
            alt="Logo Mascotas Hover" 
            class="logo-img logo-hover"
          >
        </div>
        <div class="btn-text">
          <span class="btn-title">Mascotas</span>
          <span class="btn-subtitle">Perrote y Gatote</span>
        </div>
      </a>

      <a href="../HERRAMIENTAS/" class="choice-btn btn-herramientas" id="btnHerramientas">
        <div class="logo-container">
          <img 
            src="./images/toro-amarillo.png" 
            alt="Logo Herramientas" 
            class="logo-img logo-default"
          >
          <img 
            src="./images/toro-negro.png" 
            alt="Logo Herramientas Hover" 
            class="logo-img logo-hover"
          >
        </div>
        <div class="btn-text">
          <span class="btn-title">Herramientas</span>
          <span class="btn-subtitle">Súper Agro Herramientas</span>
        </div>
      </a>
    </div>

    <footer class="footer">
      <p>© 2026 El Súper Agropecuario. Todos los derechos reservados.</p>
    </footer>
  </main>

  <script>
    // Handle touch events for mobile devices
    const buttons = document.querySelectorAll('.choice-btn');

    buttons.forEach(btn => {
      // Touch start - add touched class
      btn.addEventListener('touchstart', function(e) {
        this.classList.add('touched');
      }, { passive: true });

      // Touch end - remove touched class after a delay
      btn.addEventListener('touchend', function(e) {
        const button = this;
        setTimeout(() => {
          button.classList.remove('touched');
        }, 300);
      }, { passive: true });

      // Touch cancel - remove touched class
      btn.addEventListener('touchcancel', function(e) {
        this.classList.remove('touched');
      }, { passive: true });

      // Mouse leave - ensure class is removed
      btn.addEventListener('mouseleave', function(e) {
        this.classList.remove('touched');
      });
    });
  </script>
</body>
</html>
